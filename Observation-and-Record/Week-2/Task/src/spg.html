<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Generator</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Input Form -->
    <div class="form-container">
        <h2 style="text-align: center; margin-top: 0;">Enter Details</h2>
        
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" value="Abhishek">
        
        <label for="rollInput">Roll Number</label>
        <input type="text" id="rollInput" value="A24126552127">
        
        <label for="deptInput">Department</label>
        <input type="text" id="deptInput" value="CSE (AI & ML)">
        
        <label for="cgpaInput">CGPA</label>
        <input type="number" id="cgpaInput" step="0.01" value="7.79">
        
        <button id="generateBtn">Generate Profile</button>
    </div>

    <!-- Container for dynamic DOM elements -->
    <div id="profile-output"></div>

    <!-- Link to external JavaScript -->
    <script src="script.js" defer></script>
</body>
</html>
